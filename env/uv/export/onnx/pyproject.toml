[project]
name = "tf-yolo-export-onnx"
version = "0.1.0"
description = "TF_YOLO export inference environment (onnx)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pyyaml==6.0.3",
    "tqdm==4.67.3",
    "pycocotools==2.0.11",
    "requests==2.34.2",
    "psutil==7.2.2",
    "nvidia-ml-py==13.610.43",
    "onnxruntime-gpu==1.22.0; platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.24.0.43; platform_machine == 'x86_64'",
    "onnxruntime==1.22.0; platform_machine == 'aarch64'",
]
