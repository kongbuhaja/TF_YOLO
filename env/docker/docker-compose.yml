name: tf_yolo

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

x-common: &common
  stdin_open: true
  tty: true
  privileged: true
  network_mode: host
  volumes:
    - ../../..:/home/ML
    - /dev:/dev
  working_dir: /home/ML/${REPO_DIR:-TF_YOLO}

services:
  dev:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: env/docker/dev.dockerfile
    image: tf_yolo:latest
    container_name: tf_yolo
    <<: [*common, *gpu]
    mem_limit: 64g
    shm_size: 8gb
    environment:
      HOST_PERMS: "${HOST_PERMS:-1000:1000}"
    command: ["bash"]

  edge-base:
    profiles: ["infer", "edge", "edge-base"]
    build:
      context: ../..
      dockerfile: env/docker/edge_base.dockerfile
    image: tf_yolo_edge_base:latest
    command: ["true"]

  edge-rpi-cpu:
    profiles: ["infer", "edge"]
    depends_on:
      - edge-base
    build:
      context: ../..
      dockerfile: env/docker/edge_rpi_cpu.dockerfile
    image: tf_yolo_edge_rpi_cpu:latest
    <<: *common
    command: ["bash"]

  edge-rpi-coral:
    profiles: ["infer", "edge"]
    depends_on:
      - edge-base
    build:
      context: ../..
      dockerfile: env/docker/edge_rpi_coral.dockerfile
    image: tf_yolo_edge_rpi_coral:latest
    <<: *common
    command: ["bash"]

  edge-rpi-ncs2:
    profiles: ["infer", "edge"]
    build:
      context: ../..
      dockerfile: env/docker/edge_rpi_ncs2.dockerfile
    image: tf_yolo_edge_rpi_ncs2:latest
    <<: *common
    command: ["bash"]

  edge-jetson:
    profiles: ["infer", "edge"]
    build:
      context: ../..
      dockerfile: env/docker/edge_jetson.dockerfile
    image: tf_yolo_edge_jetson:latest
    <<: *common
    runtime: nvidia
    command: ["bash"]
